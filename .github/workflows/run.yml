name: run

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: 10 16 * * *

permissions:
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          # 在原有推送渠道之外追加 console: ，让签到结果同时打进 Actions 日志
          NOTIFY: |
            ${{ secrets.NOTIFY }}
            console:
      # 仓库 60 天无 push 时 GitHub 会停掉 cron；每次跑完都调一次 enable API 续命
      # （第三方 keepalive action 已被 GitHub 封，故用内置 gh 直接调）
      - name: keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/run.yml/enable" && echo "keepalive OK"
